<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ركلات الترجيح • تحدي الأساطير</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
:root{--bg:#1b281e;--paper:#ede6d8;--ink:#231f1a;--gold:#d4af37}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;background:var(--bg);color:#fff;font-family:'Cairo',sans-serif;padding:8px;text-align:center}
.wrap{max-width:520px;margin:0 auto}
h1{font-family:'Aref Ruqaa',serif;font-size:32px;margin:2px 0 6px;color:var(--gold)}
.hud{display:flex;justify-content:space-between;align-items:center;background:#ffffff14;padding:8px 14px;border-radius:14px;margin-bottom:8px}
.dots{display:flex;gap:6px;direction:ltr}
.dot{width:18px;height:18px;border-radius:50%;background:#ffffff33;border:2px solid #fff6}
.dot.g{background:#4cd964;border-color:#fff}
.dot.m{background:#ff3b30;border-color:#fff}
.score{font-size:16px;font-weight:800;color:var(--gold)}
canvas{width:100%;aspect-ratio:4/5;background:#2e7d32;border-radius:18px;display:block;box-shadow:0 10px 30px #0006;cursor:pointer;touch-action:manipulation}
.msg{height:28px;font-size:18px;font-weight:800;margin:6px 0;color:var(--gold)}
.players{display:flex;gap:8px;overflow-x:auto;padding:6px 2px;scrollbar-width:none}
.players::-webkit-scrollbar{display:none}
.p-btn{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;opacity:.6;transition:.2s}
.p-btn.act{opacity:1;transform:scale(1.08)}
.p-btn img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid #fff}
.p-btn.act img{border-color:var(--gold);box-shadow:0 0 10px var(--gold)}
.p-btn span{font-size:10px;font-weight:700}
button.rst{margin-top:8px;border:0;background:var(--gold);color:#1b281e;padding:8px 22px;border-radius:14px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<h1>ركلات الترجيح</h1>
<div class="hud">
<div class="score" id="sc">الأهداف: 0 / 5</div>
<div class="dots" id="dots"></div>
</div>
<canvas id="cv" width="400" height="500"></canvas>
<div class="msg" id="msg">اضغط داخل المرمى للتسديد!</div>
<div class="players" id="plist"></div>
<button class="rst" onclick="resetGame()">إعادة المباراة</button>
</div>
<script>
const B="https://githubusercontent.com";
const P=[
 {id:"messi",name:"ميسي",img:B+"messi.jpg.JPEG"},
 {id:"cr7",name:"كريستيانو",img:B+"cr.jpg.JPG"},
 {id:"mara",name:"مارادونا",img:B+"maradona.jpg.JPG"},
 {id:"r9",name:"الظاهرة",img:B+"ronaldo.jpg.JPG"},
 {id:"pele",name:"بيليه",img:B+"pele.jpg.JPG"},
 {id:"zidane",name:"زيدان",img:B+"ziedan.jpg.JPG"},
 {id:"r10",name:"رونالدينيو",img:B+"rone.jpg.jpg"},
 {id:"neymar",name:"نيمار",img:B+"ney.jpg.JPG"},
 {id:"cruyff",name:"كرويف",img:B+"johan.jpg.JPG"},
 {id:"iniesta",name:"إنيستا",img:B+"in.jpg.jpg"},
 {id:"xavi",name:"تشافي",img:B+"xavi.jpg.JPG"},
 {id:"modric",name:"مودريتش",img:B+"luka.jpg.JPG"},
 {id:"beck",name:"بيكنباور",img:B+"binkabowr.jpg.JPG"},
 {id:"difa",name:"دي ستيفانو",img:B+"de.jpg.jpg"}
];
let curP=P[0],imgMap={},shots=[],state="idle",t=0;
let ball={x:200,y:410,r:14,tx:200,ty:410};
let gk={x:200,y:155,tx:200,ty:155,ang:0,tang:0};
const actx=new (window.AudioContext||window.webkitAudioContext)();

function tone(f,d,type="sine"){
 const o=actx.createOscillator(),g=actx.createGain();
 o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.15,actx.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);
 o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);
}

P.forEach((p,i)=>{
 const im=new Image();im.src=p.img;imgMap[p.id]=im;
 const d=document.createElement("div");
 d.className="p-btn"+(i===0?" act":"");
 d.innerHTML=`<img src="${p.img}"><span>${p.name}</span>`;
 d.onclick=()=>{document.querySelectorAll(".p-btn").forEach(x=>x.classList.remove("act"));d.classList.add("act");curP=p;};
 plist.appendChild(d);
});

function resetGame(){
 shots=[];state="idle";t=0;
 ball={x:200,y:410,r:14,tx:200,ty:410};
 gk={x:200,y:155,tx:200,ty:155,ang:0,tang:0};
 msg.textContent="اضغط داخل المرمى للتسديد!";
 updateHUD();
}

function updateHUD(){
 const goals=shots.filter(x=>x==="g").length;
 sc.textContent=`الأهداف: ${goals} / 5`;
 dots.innerHTML=[0,1,2,3,4].map(i=>`<div class="dot ${shots[i]||''}"></div>`).join("");
}

cv.addEventListener("pointerdown",e=>{
 if(state!=="idle"||shots.length>=5)return;
 if(actx.state==="suspended")actx.resume();
 const rect=cv.getBoundingClientRect();
 const cx=(e.clientX-rect.left)*(400/rect.width);
 const cy=(e.clientY-rect.top)*(500/rect.height);
 if(cy>230)return;

 ball.tx=Math.max(65,Math.min(335,cx));
 ball.ty=Math.max(85,Math.min(185,cy));

 const zones=[{x:95,y:120,a:-.7},{x:95,y:165,a:-1.1},{x:200,y:150,a:0},{x:305,y:120,a:.7},{x:305,y:165,a:1.1}];
 const pick=zones[Math.floor(Math.random()*zones.length)];
 gk.tx=pick.x;gk.ty=pick.y;gk.tang=pick.a;
 state="kick";t=0;
 tone(140,.15,"triangle");
});

function loop(){
 t+=0.045;
 if(state==="kick"){
  ball.x+=(ball.tx-ball.x)*0.16;
  ball.y+=(ball.ty-ball.y)*0.16;
  ball.r=14-Math.min(1,t)*4.5;
  gk.x+=(gk.tx-gk.x)*0.14;
  gk.y+=(gk.ty-gk.y)*0.14;
  gk.ang+=(gk.tang-gk.ang)*0.14;

  if(t>=1){
   const dist=Math.hypot(ball.tx-gk.tx,ball.ty-gk.ty);
   const saved=dist<42;
   if(saved){
    shots.push("m");msg.textContent="تصدّى لها الحارس! ❌";tone(110,.3,"sawtooth");
   }else{
    shots.push("g");msg.textContent="قووووووول! ⚽🔥";tone(520,.15);setTimeout(()=>tone(680,.25),120);
   }
   updateHUD();
   state="wait";
   setTimeout(()=>{
    if(shots.length>=5){
     const g=shots.filter(x=>x==="g").length;
     msg.textContent=g>=3?`مبروك! فزت بنتيجة ${g} من 5 🏆`:`انتهت المباراة (${g} من 5) حاول مجدداً!`;
    }else{
     ball={x:200,y:410,r:14,tx:200,ty:410};
     gk={x:200,y:155,tx:200,ty:155,ang:0,tang:0};
     state="idle";msg.textContent="سدد الركلة التالية!";
    }
   },1100);
  }
 }
 draw();
 requestAnimationFrame(loop);
}

function draw(){
 const c=cv.getContext("2d");
 c.fillStyle="#2e7d32";c.fillRect(0,0,400,500);
 for(let i=0;i<10;i++){if(i%2){c.fillStyle="#256a29";c.fillRect(0,i*50,400,50);}}

 c.strokeStyle="#ffffffaa";c.lineWidth=3;
 c.strokeRect(25,185,350,240);
 c.strokeRect(95,185,210,95);
 c.beginPath();c.arc(200,410,4,0,7);c.fillStyle="#fff";c.fill();

 c.fillStyle="#ffffff22";c.fillRect(55,75,290,110);
 c.strokeStyle="#ffffff55";c.lineWidth=1;
 for(let x=55;x<=345;x+=14){c.beginPath();c.moveTo(x,75);c.lineTo(x,185);c.stroke();}
 for(let y=75;y<=185;y+=14){c.beginPath();c.moveTo(55,y);c.lineTo(345,y);c.stroke();}
 c.strokeStyle="#fff";c.lineWidth=6;c.strokeRect(55,75,290,110);

 c.save();c.translate(gk.x,gk.y);c.rotate(gk.ang);
 c.fillStyle="#ff9800";c.beginPath();c.roundRect(-14,-22,28,44,8);c.fill();
 c.fillStyle="#ffe0b2";c.beginPath();c.arc(0,-30,10,0,7);c.fill();
 c.fillStyle="#fff";c.beginPath();c.arc(-22,-10,7,0,7);c.arc(22,-10,7,0,7);c.fill();
 c.restore();

 const im=imgMap[curP.id];
 c.save();c.beginPath();c.arc(135,435,26,0,7);c.clip();
 if(im&&im.complete)c.drawImage(im,109,409,52,52);
 c.restore();
 c.strokeStyle="#d4af37";c.lineWidth=2.5;c.beginPath();c.arc(135,435,26,0,7);c.stroke();

 c.fillStyle="#0004";c.beginPath();c.ellipse(ball.x,ball.y+ball.r+3,ball.r,ball.r*.4,0,0,7);c.fill();
 c.fillStyle="#fff";c.beginPath();c.arc(ball.x,ball.y,ball.r,0,7);c.fill();
 c.strokeStyle="#222";c.lineWidth=1.5;c.stroke();
 c.fillStyle="#222";c.beginPath();c.arc(ball.x,ball.y,ball.r*.4,0,7);c.fill();
}
resetGame();loop();
</script>
</body>
</html>
