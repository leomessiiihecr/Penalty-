<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جوالي الهلالي 💙</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #070d19; }
    .iphone {
      width: 350px; height: 720px; border-radius: 48px; border: 11px solid #1c2536;
      background: linear-gradient(160deg, rgba(0, 51, 160, 0.85) 0%, rgba(0, 26, 87, 0.92) 100%), url('bg.jpg') center/cover no-repeat;
      position: relative; overflow: hidden; box-shadow: 0 25px 60px rgba(0, 85, 255, 0.4);
      color: white; display: flex; flex-direction: column; justify-content: space-between;
    }
    .dynamic-island { width: 115px; height: 28px; background: #000; border-radius: 20px; margin: 12px auto 0; display: flex; align-items: center; justify-content: flex-end; padding: 0 10px; z-index: 50; position: relative; }
    .camera-dot { width: 10px; height: 10px; background: #1a2a4a; border-radius: 50%; }
    .status-bar { display: flex; justify-content: space-between; padding: 0 26px; font-size: 13px; font-weight: bold; margin-top: -22px; z-index: 50; position: relative; }

    /* الشاشة الرئيسية */
    .widget {
      margin: 25px 20px 5px; padding: 16px; border-radius: 22px;
      background: rgba(255, 255, 255, 0.16); backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.28); text-align: center;
    }
    .widget h3 { font-size: 15px; margin-bottom: 5px; color: #fff; line-height: 1.5; }
    .widget p { font-size: 12px; color: #cce0ff; }

    .apps-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 20px; text-align: center; }
    .app { cursor: pointer; transition: transform 0.15s; }
    .app:active { transform: scale(0.9); }
    .icon {
      width: 58px; height: 58px; border-radius: 15px; margin: 0 auto 6px;
      display: flex; align-items: center; justify-content: center; font-size: 26px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25); position: relative;
    }
    .lock-badge {
      position: absolute; bottom: -4px; left: -4px; background: #ff3b30; color: #fff;
      font-size: 11px; width: 20px; height: 20px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; border: 2px solid #fff;
    }
    .app span { font-size: 11px; font-weight: 500; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }

    .dock {
      background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(18px);
      margin: 0 16px 22px; padding: 12px; border-radius: 28px; display: flex; justify-content: space-around;
    }

    .modal {
      position: absolute; inset: 0; background: #f2f4f8; color: #111;
      display: none; flex-direction: column; padding: 45px 18px 22px; z-index: 20;
    }
    .modal.active { display: flex; }
    .modal-header { font-size: 19px; font-weight: bold; color: #0033a0; margin-bottom: 12px; border-bottom: 1px solid #ddd; padding-bottom: 8px; }
    
    /* شاشة قفل الملاحظات */
    .note-lock-box {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    }
    .dots { display: flex; justify-content: center; gap: 12px; margin: 15px 0 20px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #0033a0; transition: background 0.15s; }
    .dot.filled { background: #0033a0; }
    .dots.shake { animation: shake 0.35s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    .keypad { display: grid; grid-template-columns: repeat(3, 62px); gap: 12px; justify-content: center; direction: ltr; }
    .key {
      width: 62px; height: 62px; border-radius: 50%;
      background: #e2e8f5; border: none; color: #0033a0;
      font-size: 22px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .key:active { background: #0033a0; color: #fff; }
    .key.empty { background: transparent; cursor: default; }
    .key.del { background: transparent; font-size: 14px; color: #555; }

    /* الألبوم */
    .gallery-container { flex: 1; overflow-y: auto; padding-bottom: 10px; }
    .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .gallery img {
      width: 100%; height: 115px; object-fit: cover; border-radius: 12px;
      background: #dce3f0; border: 2px solid #0033a0; cursor: pointer;
    }

    .lightbox {
      position: absolute; inset: 0; background: rgba(0,0,0,0.92); z-index: 30;
      display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
    }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 100%; max-height: 75%; border-radius: 16px; border: 2px solid #0055ff; }
    .lightbox button { margin-top: 20px; padding: 10px 24px; background: #0055ff; color: #fff; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; }

    .chat-bubble { background: #0033a0; color: #fff; padding: 10px 14px; border-radius: 16px; margin-bottom: 10px; font-size: 14px; align-self: flex-start; max-width: 85%; }
    .chat-bubble.other { background: #e5e5ea; color: #000; align-self: flex-end; }

    .close-btn {
      margin-top: 12px; padding: 12px; background: #0033a0; color: #fff;
      border: none; border-radius: 14px; font-size: 15px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

<div class="iphone">
  <div>
    <div class="dynamic-island"><div class="camera-dot"></div></div>
    <div class="status-bar"><span>9:02</span><span>5G 💙</span></div>
  </div>

  <!-- محتوى الشاشة الرئيسية -->
  <div style="flex:1; display:flex; flex-direction:column; justify-content:space-between;">
    <div class="widget">
      <h3>كبير آسيا 💙🏆</h3>
      <p>حياكم الله في جوالي.. حاولوا تفتحون الملاحظة السرية!</p>
    </div>

    <div class="apps-grid">
      <div class="app" onclick="openModal('photos')">
        <div class="icon" style="background: linear-gradient(45deg, #0055ff, #00aaff);">🖼️</div>
        <span>الألبوم (8)</span>
      </div>
      <div class="app" onclick="openNotes()">
        <div class="icon" style="background: #ffcc00;">📝<div class="lock-badge">🔒</div></div>
        <span>الملاحظات</span>
      </div>
      <div class="app" onclick="openModal('whatsapp')">
        <div class="icon" style="background: #25d366;">💬</div>
        <span>قروب الهلال</span>
      </div>
      <div class="app" onclick="openModal('trophies')">
        <div class="icon" style="background: #1c1c1e;">🏆</div>
        <span>البطولات</span>
      </div>
    </div>

    <div class="dock">
      <div class="icon" style="background: #ffcc00;" onclick="openNotes()">🔒</div>
      <div class="icon" style="background: #007aff;" onclick="openModal('photos')">📸</div>
      <div class="icon" style="background: #34c759;" onclick="openModal('whatsapp')">💬</div>
    </div>
  </div>

  <!-- تطبيق الألبوم (8 صور) -->
  <div class="modal" id="photos">
    <div class="modal-header">ألبوم الصور الهلالي (8) 💙</div>
    <p style="font-size: 11px; color: #555; margin-bottom: 10px;">اضغط على أي صورة لتكبيرها:</p>
    <div class="gallery-container">
      <div class="gallery">
        <img src="pic1.jpg" alt="صورة 1" onclick="zoomImg(this.src)">
        <img src="pic2.jpg" alt="صورة 2" onclick="zoomImg(this.src)">
        <img src="pic3.jpg" alt="صورة 3" onclick="zoomImg(this.src)">
        <img src="pic4.jpg" alt="صورة 4" onclick="zoomImg(this.src)">
        <img src="pic5.jpg" alt="صورة 5" onclick="zoomImg(this.src)">
        <img src="pic6.jpg" alt="صورة 6" onclick="zoomImg(this.src)">
        <img src="pic7.jpg" alt="صورة 7" onclick="zoomImg(this.src)">
        <img src="pic8.jpg" alt="صورة 8" onclick="zoomImg(this.src)">
      </div>
    </div>
    <button class="close-btn" onclick="closeModals()">العودة للشاشة الرئيسية</button>
  </div>

  <div class="lightbox" id="lightbox" onclick="closeZoom()">
    <img id="zoomedImg" src="" alt="صورة مكبرة">
    <button onclick="closeZoom()">إغلاق الصورة</button>
  </div>

  <!-- تطبيق الملاحظات (مقفل بالرمز 11914) -->
  <div class="modal" id="notes">
    <div class="modal-header">الملاحظات السرية 🔒</div>
    
    <!-- واجهة القفل داخل الملاحظات -->
    <div class="note-lock-box" id="noteLockBox">
      <div style="font-size: 32px; margin-bottom: 8px;">🔐</div>
      <div style="font-size: 14px; font-weight: bold; color: #0033a0;" id="passMsg">أدخل الرمز السري لفتح الملاحظة</div>
      <div class="dots" id="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <div class="keypad">
        <button class="key" onclick="pressKey('1')">1</button>
        <button class="key" onclick="pressKey('2')">2</button>
        <button class="key" onclick="pressKey('3')">3</button>
        <button class="key" onclick="pressKey('4')">4</button>
        <button class="key" onclick="pressKey('5')">5</button>
        <button class="key" onclick="pressKey('6')">6</button>
        <button class="key" onclick="pressKey('7')">7</button>
        <button class="key" onclick="pressKey('8')">8</button>
        <button class="key" onclick="pressKey('9')">9</button>
        <button class="key empty"></button>
        <button class="key" onclick="pressKey('0')">0</button>
        <button class="key del" onclick="delKey()">حذف</button>
      </div>
    </div>

    <!-- محتوى الملاحظة بعد فتح الرمز -->
