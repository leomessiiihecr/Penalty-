<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>جوال الزعيم 💙</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#030914;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Cairo',sans-serif}
.wp{position:fixed;inset:0;background:radial-gradient(circle at 50% 15%,#1565c0 0%,#092659 45%,#030d21 100%);z-index:1}
.wp::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 80%,rgba(33,150,243,.22),transparent 50%)}
.island{position:fixed;top:11px;left:50%;transform:translateX(-50%);width:118px;height:32px;background:#000;border-radius:20px;z-index:50;box-shadow:0 4px 14px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:flex-end;padding-right:10px}
.cam-dot{width:10px;height:10px;border-radius:50%;background:#111b33;border:1px solid #1f325c}

.screen{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;transition:transform .42s cubic-bezier(.22,1,.36,1),opacity .35s}
.hide{opacity:0;pointer-events:none;transform:scale(.96)}

/* Lock Screen */
.lock{justify-content:space-between;padding:54px 18px 20px;z-index:10;touch-action:none}
.lock.unlocked{transform:translateY(-105%);opacity:0;pointer-events:none}
.clock{text-align:center}
.date{font-size:17px;font-weight:600;color:#bbdefb;letter-spacing:.2px;text-shadow:0 2px 10px rgba(0,0,0,.3)}
.time{font-size:82px;font-weight:700;line-height:1;letter-spacing:-2px;margin-top:2px;text-shadow:0 6px 24px rgba(0,0,0,.35)}
.notifs{display:flex;flex-direction:column;gap:11px;margin:auto 0 22px}
.notif{background:rgba(15,30,60,.62);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:13px;box-shadow:0 10px 30px rgba(0,0,0,.35);cursor:pointer;transition:transform .15s}
.notif:active{transform:scale(.97)}
.n-ic{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#25d366,#128c7e);display:flex;align-items:center;justify-content:center;flex:none;position:relative;box-shadow:0 4px 10px rgba(37,211,102,.3)}
.badge{position:absolute;top:-6px;right:-6px;background:#ff3b30;color:#fff;font-size:11px;font-weight:800;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #092659}
.n-body{flex:1;text-align:right}
.n-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.n-top b{font-size:14px;font-weight:800;color:#fff}
.n-top span{color:#90caf9;font-size:11px}
.n-txt{font-size:13px;color:rgba(255,255,255,.92);line-height:1.35}
.swipe-area{text-align:center;padding:8px 0;cursor:pointer}
.swipe-pill{display:inline-block;background:rgba(255,255,255,.16);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.22);border-radius:22px;padding:10px 24px;font-size:13px;font-weight:700;margin-bottom:14px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.bar{height:5px;width:134px;background:#fff;border-radius:10px;margin:0 auto;opacity:.9}

/* Home Screen */
.home{padding:62px 22px 22px;justify-content:space-between}
.widget{background:linear-gradient(135deg,rgba(21,101,192,.55),rgba(13,43,92,.7));backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(144,202,249,.3);border-radius:24px;padding:18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 28px rgba(0,0,0,.3)}
.widget b{font-size:18px;display:block;color:#fff}
.widget span{font-size:12px;color:#bbdefb}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 14px;margin-top:26px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.app:active .ic{transform:scale(.9)}
.ic{width:62px;height:62px;border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.4);position:relative;transition:.15s}
.app span{font-size:11.5px;font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.8)}
.dock{background:rgba(255,255,255,.16);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid rgba(255,255,255,.18);border-radius:28px;padding:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

/* Apps Windows */
.win{background:#0b141a;z-index:15;padding-top:48px}
.w-head{background:#1f2c34;padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #2a3942}
.back{font-size:20px;color:#53bdeb;cursor:pointer;padding:2px 8px;font-weight:800}
.chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:9px;background-image:radial-gradient(#1f2c34 1px,transparent 1px);background-size:18px 18px}
.msg{max-width:88%;background:#1f2c34;padding:9px 12px;border-radius:14px;border-top-right-radius:3px;align-self:flex-start;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.snd{font-size:12px;font-weight:800;display:block;margin-bottom:3px}
.txt{font-size:13.5px;line-height:1.45;color:#e9edef}
.grid8{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-top:8px;border-radius:12px;overflow:hidden}
.ph{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,#0d47a1,#1976d2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .2s}
.ph:active img{transform:scale(.96)}
.ph .cap{position:relative;z-index:2;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);padding:3px 7px;border-radius:6px;font-size:10px;font-weight:700}
.ph.ok .cap{position:absolute;bottom:5px;left:5px;right:5px}

/* Photos App */
.photos-win{background:#000}
.p-grid{flex:1;overflow-y:auto;padding:8px;display:grid;grid-template-columns:repeat(2,1fr);gap:6px}

/* Viewer */
.viewer{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.97);display:none;flex-direction:column;justify-content:space-between;padding:52px 16px 26px}
.viewer.open{display:flex}
.v-box{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.v-box img{max-width:100%;max-height:64dvh;border-radius:14px;box-shadow:0 10px 35px rgba(0,0,0,.8)}
.v-fb{width:260px;height:260px;border-radius:20px;background:linear-gradient(135deg,#0d47a1,#1976d2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;border:2px solid #d4af37}
.v-nav{display:flex;justify-content:space-between;padding:0 20px}
.v-nav button{background:#1f2c34;color:#fff;border:1px solid #2a3942;padding:10px 22px;border-radius:14px;font-family:inherit;font-weight:700;font-size:14px}
</style>
</head>
<body>

<div class="island"><div class="cam-dot"></div></div>
